[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yassine,", email = "aceiny.dev@gmail.com," }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "datetime>=6.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "backend",
    "tpo",
]
